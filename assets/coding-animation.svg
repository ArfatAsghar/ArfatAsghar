    <circle cx="350" cy="105" r="6" fill="#e5533d" filter="url(#softglow)"/>
    <text x="350" y="91" text-anchor="middle" font-family="Fira Code, monospace"
      font-size="9.5" fill="#7d8590" class="planet-label">Flask</text>
  </g>
  <g style="animation: spinCCW 13s linear infinite; transform-origin:350px 165px;">
    <circle cx="350" cy="83" r="7" fill="#61dafb" filter="url(#softglow)"/>

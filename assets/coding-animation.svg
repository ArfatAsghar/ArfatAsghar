<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#0f1a1a"/>
      <stop offset="100%" stop-color="#080b0b"/>
    </radialGradient>
    <radialGradient id="sunGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0fdfa"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cometTrail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="100%" stop-color="#5eead4" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <style>
      @keyframes twinkle { 0%,100% { opacity:0.15; } 50% { opacity:0.9; } }
      @keyframes spinCW  { 0% { transform:rotate(0deg); } 100% { transform:rotate(360deg); } }
      @keyframes spinCCW { 0% { transform:rotate(0deg); } 100% { transform:rotate(-360deg); } }
      @keyframes sunPulse { 0%,100% { r:30; opacity:0.85; } 50% { r:36; opacity:1; } }
      @keyframes comet {
        0%   { transform: translate(-60px, -40px); opacity:0; }
        8%   { opacity:1; }
        35%  { transform: translate(760px, 260px); opacity:0; }
        100% { transform: translate(760px, 260px); opacity:0; }
      }
      @keyframes fadeText { 0%,100% { opacity:0.75; } 50% { opacity:1; } }
      @keyframes nameGlow {
        0%,100% { opacity:0.9; filter:drop-shadow(0 0 2px #14b8a6); }
        50%     { opacity:1;   filter:drop-shadow(0 0 8px #14b8a6); }
      }
      .planet-label { animation: fadeText 4s ease-in-out infinite; }
      .sun { animation: sunPulse 2.4s ease-in-out infinite; transform-origin: 350px 165px; }
      .comet-group { animation: comet 6s linear infinite; animation-delay: 1s; }
      .name { animation: nameGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="340" rx="18" fill="url(#bgGrad)"/>

  <clipPath id="clip"><rect x="0" y="0" width="700" height="340" rx="18"/></clipPath>
  <g clip-path="url(#clip)">

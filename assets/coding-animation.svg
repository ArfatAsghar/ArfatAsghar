    <!-- comet -->
    <g class="comet-group">
      <line x1="0" y1="0" x2="-45" y2="-30" stroke="url(#cometTrail)" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="2.6" fill="#f0fdfa" filter="url(#softglow)"/>
    </g>

    <!-- orbits -->
    <circle cx="350" cy="165" r="60" fill="none" stroke="#1f6f66" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="1 6"/>
  <circle cx="350" cy="165" r="82" fill="none" stroke="#1f6f66" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="1 6"/>
  <circle cx="350" cy="165" r="104" fill="none" stroke="#1f6f66" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="1 6"/>

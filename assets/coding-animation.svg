  </g>

    <!-- sun / core -->
    <circle cx="350" cy="165" r="46" fill="url(#sunGrad)" opacity="0.55" filter="url(#bigglow)"/>
    <circle cx="350" cy="165" r="30" fill="url(#sunGrad)" class="sun" filter="url(#softglow)"/>

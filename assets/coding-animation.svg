<svg width="700" height="300" viewBox="0 0 700 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#0f1f1e"/>
      <stop offset="100%" stop-color="#0a0e0e"/>
    </radialGradient>
    <radialGradient id="coreGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="60%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0d7a6c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes barPulse {
        0%, 100% { transform: scaleY(0.45); opacity: 0.55; }
        50%      { transform: scaleY(1);    opacity: 1; }
      }
      @keyframes corePulse {
        0%, 100% { r: 26; opacity: 0.85; }
        50%      { r: 32; opacity: 1; }
      }
      @keyframes ringSpin  { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      @keyframes ringSpinR { 0% { transform: rotate(0deg); } 100% { transform: rotate(-360deg); } }
      @keyframes sweep {
        0%   { transform: translateY(-300px); opacity: 0; }
        10%  { opacity: 0.9; }
        90%  { opacity: 0.9; }
        100% { transform: translateY(300px); opacity: 0; }
      }
      @keyframes letterIn {
        0%   { opacity: 0; filter: blur(4px); transform: translateY(6px); }
        15%  { opacity: 1; filter: blur(0);   transform: translateY(0); }
        85%  { opacity: 1; }
        100% { opacity: 0.15; }
      }
      @keyframes dotBlink { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }

      .bar { }
      .ring1 { animation: ringSpin 14s linear infinite; transform-origin: 350px 150px; }
      .ring2 { animation: ringSpinR 20s linear infinite; transform-origin: 350px 150px; }
      .core  { animation: corePulse 1.8s ease-in-out infinite; transform-origin: 350px 150px; }
      .sweepline { animation: sweep 5s linear infinite; }
      .name-letter { font-family: 'Fira Code', monospace; font-weight: 700; animation: letterIn 6s ease-in-out infinite; }
      .role-text { font-family: 'Fira Code', monospace; }
      .dot { animation: dotBlink 1.4s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="300" rx="18" fill="url(#bgGrad)"/>

  <clipPath id="clipRound"><rect x="0" y="0" width="700" height="300" rx="18"/></clipPath>
  <g clip-path="url(#clipRound)">
    <rect x="0" y="0" width="700" height="120" class="sweepline" fill="url(#sweepGrad)"/>
  </g>

  <!-- outer rotating rings -->
  <circle cx="350" cy="150" r="95" fill="none" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="2 10" class="ring1"/>
  <circle cx="350" cy="150" r="108" fill="none" stroke="#5eead4" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="1 14" class="ring2"/>


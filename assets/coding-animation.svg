<svg width="700" height="340" viewBox="0 0 700 340" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0f1b1a"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#102422"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .scr-line { font-family: 'Fira Code','Courier New', monospace; font-size: 14.5px; }
      .kw   { fill: #ff7ab2; }
      .fn   { fill: #82e0aa; }
      .str  { fill: #f7dc6f; }
      .cmt  { fill: #7d8590; }
      .txt  { fill: #e6edf3; }
      .cursor { fill: #14b8a6; }
      .desk   { fill: #171717; }
      .body   { fill: #14b8a6; }
      .body2  { fill: #0f9488; }
      .skin   { fill: #d9a66c; }
      .screen { fill: url(#screenGlow); stroke: #2dd4bf; stroke-width: 2; opacity: 0.95; }
      .frame  { fill: #21262d; }
      .star   { fill: #e6edf3; }

      @keyframes blink       { 0%,45%{opacity:1} 50%,100%{opacity:0} }
      @keyframes twinkle     { 0%,100%{opacity:.15} 50%{opacity:.9} }
      @keyframes typeline    { 0%{opacity:0; transform:translateX(-6px)} 8%{opacity:1; transform:translateX(0)} 92%{opacity:1} 100%{opacity:0} }
      @keyframes armMove     { 0%,100%{transform:rotate(0deg)} 50%{transform:rotate(10deg)} }
      @keyframes headBob     { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
      @keyframes eyeBlink    { 0%,92%,100%{transform:scaleY(1)} 96%{transform:scaleY(0.1)} }
      @keyframes steamRise   { 0%{opacity:0; transform:translateY(0) scale(0.6)} 30%{opacity:.8} 100%{opacity:0; transform:translateY(-26px) scale(1.3)} }
      @keyframes floatY      { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
      @keyframes barFill     { 0%{transform:scaleX(0)} 70%{transform:scaleX(1)} 100%{transform:scaleX(1)} }
      @keyframes orbit       { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
      @keyframes screenPulse { 0%,100%{opacity:.55} 50%{opacity:1} }

      .cursor { animation: blink 1s steps(1) infinite; }
      .l1{animation:typeline 8s ease-in-out infinite; animation-delay:0s}
      .l2{animation:typeline 8s ease-in-out infinite; animation-delay:.6s}
      .l3{animation:typeline 8s ease-in-out infinite; animation-delay:1.2s}
      .l4{animation:typeline 8s ease-in-out infinite; animation-delay:1.8s}
      .l5{animation:typeline 8s ease-in-out infinite; animation-delay:2.4s}
      .l6{animation:typeline 8s ease-in-out infinite; animation-delay:3.0s}

      .arm-r{animation:armMove .7s ease-in-out infinite; transform-origin:520px 210px}
      .arm-l{animation:armMove .7s ease-in-out infinite reverse; transform-origin:480px 210px}
      .head{animation:headBob 2.4s ease-in-out infinite; transform-origin:500px 150px}
      .eye{animation:eyeBlink 4s ease-in-out infinite; transform-origin:center}
      .twk{animation:twinkle 2.5s ease-in-out infinite}
      .steam1{animation:steamRise 2.6s ease-in-out infinite}
      .steam2{animation:steamRise 2.6s ease-in-out infinite; animation-delay:.9s}
      .steam3{animation:steamRise 2.6s ease-in-out infinite; animation-delay:1.7s}
      .float1{animation:floatY 3.2s ease-in-out infinite}
      .float2{animation:floatY 3.6s ease-in-out infinite; animation-delay:.5s}
      .float3{animation:floatY 2.8s ease-in-out infinite; animation-delay:1s}
      .bar{animation:barFill 6s ease-in-out infinite; transform-origin:left center}
      .ring{animation:orbit 10s linear infinite; transform-origin:565px 95px}
      .glowpulse{animation:screenPulse 3s ease-in-out infinite}
    </style>
  </defs>

  <rect x="0" y="0" width="700" height="340" rx="18" fill="url(#bgGrad)"/>

  <!-- twinkling stars -->
  <circle class="star twk" cx="30" cy="24" r="1.6"/>
  <circle class="star twk" cx="600" cy="30" r="1.3" style="animation-delay:.4s"/>
  <circle class="star twk" cx="655" cy="70" r="1.8" style="animation-delay:.9s"/>
  <circle class="star twk" cx="620" cy="230" r="1.2" style="animation-delay:1.3s"/>
  <circle class="star twk" cx="20" cy="200" r="1.4" style="animation-delay:1.7s"/>
  <circle class="star twk" cx="660" cy="150" r="1.5" style="animation-delay:.6s"/>

  <!-- floating tech tags in background -->
  <g class="float1" opacity="0.8">
    <text x="580" y="60" class="scr-line fn" font-size="13">&lt;/&gt;</text>
  </g>
  <g class="float2" opacity="0.7">
    <text x="600" y="120" class="scr-line kw" font-size="12">{ }</text>
  </g>
  <g class="float3" opacity="0.7">
    <text x="575" y="180" class="scr-line str" font-size="12">git</text>
  </g>

  <!-- orbiting ring accent behind figure -->
  <g class="ring" opacity="0.5">
    <circle cx="565" cy="95" r="34" fill="none" stroke="#14b8a6" stroke-width="1.4" stroke-dasharray="4 6"/>
  </g>

  <!-- desk -->
  <rect x="0" y="285" width="700" height="55" class="desk"/>
  <rect x="0" y="285" width="700" height="4" fill="#14b8a6" opacity="0.4"/>

  <!-- laptop -->
  <rect x="40" y="45" width="380" height="225" rx="10" class="frame"/>
  <rect x="55" y="60" width="350" height="175" rx="4" class="screen" filter="url(#glow)"/>
  <rect x="55" y="60" width="350" height="175" rx="4" fill="none" stroke="#14b8a6" stroke-width="1" class="glowpulse"/>

  <circle cx="70" cy="50" r="3" fill="#ff5f56"/>
  <circle cx="82" cy="50" r="3" fill="#ffbd2e"/>
  <circle cx="94" cy="50" r="3" fill="#27c93f"/>

  <g class="scr-line">
    <text x="65" y="90" class="l1"><tspan class="kw">const</tspan><tspan class="txt"> dev </tspan><tspan class="kw">=</tspan><tspan class="txt"> {</tspan></text>
    <text x="80" y="111" class="l2"><tspan class="txt">name: </tspan><tspan class="str">"Arfat Asghar"</tspan><tspan class="txt">,</tspan></text>
    <text x="80" y="132" class="l3"><tspan class="txt">role: </tspan><tspan class="str">"Full Stack Dev"</tspan><tspan class="txt">,</tspan></text>
    <text x="80" y="153" class="l4"><tspan class="txt">stack: [</tspan><tspan class="fn">"Flask"</tspan><tspan class="txt">, </tspan><tspan class="fn">"React"</tspan><tspan class="txt">],</tspan></text>
    <text x="65" y="174" class="l5"><tspan class="txt">}</tspan><tspan class="cmt"> // always building</tspan></text>
    <text x="65" y="195" class="l6"><tspan class="txt">dev.</tspan><tspan class="fn">ship</tspan><tspan class="txt">();</tspan><tspan class="cursor">▌</tspan></text>
  </g>

  <!-- progress bar: "deploying" -->
  <text x="65" y="215" class="scr-line cmt" font-size="11">deploying build...</text>
  <rect x="65" y="222" width="220" height="6" rx="3" fill="#21262d"/>
  <rect x="65" y="222" width="220" height="6" rx="3" fill="#14b8a6" class="bar"/>

  <rect x="20" y="270" width="420" height="12" rx="4" class="frame"/>

  <!-- coder figure -->
  <g class="head">
    <circle cx="500" cy="150" r="26" class="skin"/>
    <ellipse class="eye" cx="491" cy="148" rx="2.4" ry="3" fill="#2b2b2b"/>
    <ellipse class="eye" cx="509" cy="148" rx="2.4" ry="3" fill="#2b2b2b" style="animation-delay:.05s"/>
  </g>
  <rect x="478" y="176" width="44" height="70" rx="14" class="body"/>
  <rect x="478" y="246" width="20" height="30" rx="6" class="body2"/>
  <rect x="502" y="246" width="20" height="30" rx="6" class="body2"/>

  <g class="arm-l"><rect x="465" y="190" width="16" height="45" rx="8" class="body"/></g>
  <g class="arm-r"><rect x="519" y="190" width="16" height="45" rx="8" class="body"/></g>

  <rect x="455" y="255" width="100" height="14" rx="4" class="frame"/>

  <!-- coffee mug with steam -->
  <rect x="580" y="252" width="26" height="22" rx="4" fill="#e6edf3"/>
  <path d="M606 256 q10 0 10 8 q0 8 -10 8" fill="none" stroke="#e6edf3" stroke-width="3"/>
  <circle class="steam1" cx="588" cy="248" r="2.4" fill="#7d8590"/>
  <circle class="steam2" cx="594" cy="248" r="2.2" fill="#7d8590"/>
  <circle class="steam3" cx="600" cy="248" r="2.4" fill="#7d8590"/>
</svg>

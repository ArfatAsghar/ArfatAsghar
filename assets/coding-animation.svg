      font-size="9.5" fill="#7d8590" class="planet-label">React</text>
  </g>
  <g style="animation: spinCW 17s linear infinite; transform-origin:350px 165px;">
    <circle cx="350" cy="61" r="6.5" fill="#e6edf3" filter="url(#softglow)"/>
